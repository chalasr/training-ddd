# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/{Model,ValueObject,Event,Exception}'
            - '../src/Catalog/Entity'
            - '../src/Ordering/PublishedLanguage'

    # Chaque handler est branché sur son bus selon l'interface qu'il implémente
    _instanceof:
        App\Shared\Application\Command\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Query\QueryHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        App\Shared\Application\Event\EventListenerInterface:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    # Ports (interfaces du domaine et de l'application) -> adaptateurs (infrastructure)
    App\Shared\Application\Command\CommandBusInterface: '@App\Shared\Infrastructure\Symfony\Messenger\MessengerCommandBus'
    App\Shared\Application\Query\QueryBusInterface: '@App\Shared\Infrastructure\Symfony\Messenger\MessengerQueryBus'
    App\Shared\Application\Event\EventBusInterface: '@App\Shared\Infrastructure\Symfony\Messenger\MessengerEventBus'
    App\Shared\Application\Command\CommandSchedulerInterface: '@App\Shared\Infrastructure\Symfony\Messenger\MessengerCommandScheduler'
    App\Ordering\Domain\Repository\OrderRepository: '@App\Ordering\Infrastructure\Doctrine\DoctrineOrderRepository'
    App\Ordering\Application\Port\RestaurantCatalog: '@App\Ordering\Infrastructure\Catalog\RestaurantCatalogAntiCorruptionLayer'
    App\Delivery\Domain\Repository\RunRepository: '@App\Delivery\Infrastructure\Doctrine\DoctrineRunRepository'

when@test:
    services:
        # Le temps est figé dans les tests : le 1er octobre 2026 à 11h00, heure de Paris.
        # L'application lit l'heure via Psr\Clock\ClockInterface (service "clock") : ici une MockClock.
        # $clock->sleep(300) fait avancer le temps de 5 minutes, pour toute l'application.
        clock:
            class: Symfony\Component\Clock\MockClock
            arguments: ['2026-10-01 11:00:00', 'Europe/Paris']
            public: true
