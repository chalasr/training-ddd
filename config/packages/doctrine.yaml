doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            # Catalogue : contexte CRUD assumé, mapping par attributs directement sur les entités
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Entity'
                prefix: 'App\Catalog\Entity'
            # Prise de commande : attributs de mapping directement dans le Domain (compromis assumé)
            Ordering:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ordering/Domain'
                prefix: 'App\Ordering\Domain'
