framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus: ~
            query.bus: ~
            event.bus:
                # Un événement peut n'intéresser personne (encore)
                default_middleware:
                    enabled: true
                    allow_no_handlers: true

        transports:
            # R5 : les commandes programmées attendent leur échéance ici (table SQLite messenger_messages)
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            App\Ordering\Application\Command\ExpireOrderIfNotAnsweredCommand: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
